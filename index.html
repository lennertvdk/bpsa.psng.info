<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berlin Psychedelic Science Association</title>
<style>
  :root{
    --navy:#071030;
    --cyan:#47cddb;
    --purple:#8f49b9;
    --white:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:
      radial-gradient(1000px 700px at 12% 12%, rgba(71,205,219,.38), transparent 60%),
      radial-gradient(900px 700px at 88% 20%, rgba(143,73,185,.42), transparent 62%),
      radial-gradient(1100px 800px at 70% 100%, rgba(71,205,219,.24), transparent 60%),
      linear-gradient(150deg, #0d1b47 0%, var(--navy) 45%, #10063a 100%);
    color:var(--white);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    height:100dvh;
    padding:2.2vh 3vw;
    gap:1.6vh;
  }

  header{text-align:center;display:flex;flex-direction:column;align-items:center;gap:.5vh}
  header img{height:7vh;width:auto;filter:drop-shadow(0 0 14px rgba(71,205,219,.5))}
  h1{font-size:clamp(18px,2.5vh,31px);font-weight:700}
  h1 span{color:var(--cyan)}
  header p{font-size:clamp(12px,1.7vh,16px);opacity:.85;max-width:70ch}

  main{
    flex:1;min-height:0;width:100%;max-width:1200px;
    display:flex;align-items:center;justify-content:center;gap:3vw;
  }

  /* --- Karten-Stapel --- */
  .stack{
    height:100%;
    display:flex;align-items:center;justify-content:center;
    padding-left:2.5vw;
  }
  .stack img{
    max-height:100%;width:auto;max-width:26vw;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 18px 50px rgba(0,0,0,.55);
    cursor:pointer;
    transition:transform .3s ease, box-shadow .3s ease;
  }
  .stack img:last-child{margin-left:-6vw}
  .stack img:hover,.stack img.active{
    transform:translateY(-1.2vh) scale(1.04);
    box-shadow:0 24px 60px rgba(71,205,219,.35);
    z-index:5;
  }
  .stack img.active{z-index:6}

  /* --- WhatsApp --- */
  .join{display:flex;flex-direction:column;align-items:center;gap:1.5vh;text-align:center}
  .join h2{font-size:clamp(15px,2.1vh,24px);color:var(--cyan);font-weight:700}
  .join img{
    width:min(29vh,250px);border-radius:16px;background:#fff;padding:10px;
    box-shadow:0 18px 45px rgba(0,0,0,.45);
  }
  .btn{
    display:inline-block;background:var(--purple);color:var(--white);text-decoration:none;
    font-size:clamp(13px,1.9vh,18px);font-weight:700;padding:.8em 1.6em;border-radius:999px;
    box-shadow:0 10px 26px rgba(143,73,185,.5);
    transition:background .2s,transform .2s;
  }
  .btn:hover{background:var(--cyan);color:var(--navy);transform:translateY(-2px)}

  footer{
    display:flex;align-items:center;gap:1.4vw;flex-wrap:wrap;justify-content:center;
    font-size:clamp(11px,1.6vh,15px);opacity:.9;
  }
  footer a{color:var(--cyan);text-decoration:none}
  footer a:hover{text-decoration:underline}
  footer .sep{opacity:.4}
  footer img{
    height:5vh;width:5vh;border-radius:50%;
    object-fit:cover;background:var(--white);
    border:1px solid rgba(255,255,255,.25);
  }

  @media (max-width:820px){
    main{flex-direction:column;gap:2vh}
    .stack{padding-left:0}
    .stack img{max-height:34vh;max-width:40vw}
    .stack img:last-child{margin-left:-8vw}
    .join img{width:20vh}
  }
</style>
</head>
<body>

  <header>
    <img src="BPSA-Logo-Background-Removed.png" alt="BPSA Logo">
    <h1>Willkommen bei der <span>Berlin Psychedelic Science Association</span> (BPSA)</h1>
    <p>Eine studentische Community für Vorträge, Diskussionen und Vernetzung rund um Psychedelika-Forschung.</p>
  </header>

  <main>
    <div class="stack">
      <img src="Design-duo-page-1-v1.png" alt="Über uns: Du interessierst dich für Psychedelika, Bewusstsein und Wissenschaft?">
      <img src="Design-solo-v1.png" alt="Veranstaltungsplakat: Logos und Ekstase, 08.09.2026, 19:00" class="active">
    </div>

    <div class="join">
      <h2>Zoom-Link via WhatsApp</h2>
      <img src="Whatsapp-QR-code-BPSA-chat.png" alt="WhatsApp QR-Code zur BPSA-Gruppe">
      <a class="btn" href="https://chat.whatsapp.com/FjeicaFArV1JHYoMaVckRW?mode=gi_t" target="_blank" rel="noopener">WhatsApp-Gruppe beitreten</a>
    </div>
  </main>

  <footer>
    <img src="psng-logo-v1-white-extended.png" alt="PSNG Logo">
    <span>Teil des <a href="https://psng.info" target="_blank" rel="noopener">Psychedelic Student Network Germany</a></span>
    <span class="sep">·</span>
    <span>Kontakt: <a href="mailto:bpsa@psng.info">bpsa@psng.info</a></span>
  </footer>

<script>
  document.querySelectorAll('.stack img').forEach(function(img){
    img.addEventListener('click', function(){
      document.querySelectorAll('.stack img').forEach(function(i){ i.classList.remove('active'); });
      img.classList.add('active');
    });
  });
</script>
<script data-goatcounter="https://psng-bpsa.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
